<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Swasthya Connect AI</title>
  <desc id="description">
    Healthcare symbol representing connected and accessible healthcare.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10344d"/>
      <stop offset="100%" stop-color="#087e78"/>
    </linearGradient>

    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9f1e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#background)"
  />

  <!-- Decorative circles -->
  <circle
    cx="405"
    cy="105"
    r="82"
    fill="#ffffff"
    opacity=".06"
  />

  <circle
    cx="90"
    cy="420"
    r="105"
    fill="#ffffff"
    opacity=".05"
  />

  <!-- Healthcare heart -->
  <path
    d="
      M256 390
      C220 356 112 284 112 187
      C112 128 158 94 207 94
      C230 94 249 106 256 125
      C263 106 282 94 305 94
      C354 94 400 128 400 187
      C400 284 292 356 256 390
      Z
    "
    fill="url(#heart)"
  />

  <!-- Medical cross -->
  <rect
    x="228"
    y="157"
    width="56"
    height="160"
    rx="13"
    fill="#087e78"
  />

  <rect
    x="176"
    y="209"
    width="160"
    height="56"
    rx="13"
    fill="#087e78"
  />

  <!-- Gold connection point -->
  <circle
    cx="256"
    cy="237"
    r="15"
    fill="#f2b544"
  />

  <!-- Small connection nodes -->
  <circle cx="256" cy="55" r="10" fill="#f2b544"/>
  <circle cx="455" cy="256" r="10" fill="#f2b544"/>
  <circle cx="57" cy="256" r="10" fill="#f2b544"/>
</svg>
